<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Convert climbing grades across different grading systems">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Climbing Table">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='100' font-family='sans-serif' fill='%23fff'>🧗</text></svg>">
    <title>Climbing Grade Conversion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-size: 14px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size, 14px);
        }

        th {
            background-color: #f8f9fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            color: #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .grade-beginner {
            background-color: #e8f5e9;
        }

        .grade-experienced {
            background-color: #fff3e0;
        }

        .grade-advanced {
            background-color: #ffebee;
        }

        .grade-expert {
            background-color: #f3e5f5;
        }

        .grade-elite {
            background-color: #eceff1;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-beginner {
            background-color: #4caf50;
            color: white;
        }

        .badge-experienced {
            background-color: #ff9800;
            color: white;
        }

        .badge-advanced {
            background-color: #f44336;
            color: white;
        }

        .badge-expert {
            background-color: #673ab7;
            color: white;
        }

        .badge-elite {
            background-color: #263238;
            color: white;
        }

        .controls {
            padding: 20px;
            background-color: #f5f5f5;
            border-top: 1px solid #e0e0e0;
        }

        .controls h3 {
            margin-bottom: 15px;
            color: #333;
            font-size: 16px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 14px;
            color: #555;
        }

        .font-size-control {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .font-size-control label {
            font-weight: 600;
            font-size: 14px;
            color: #333;
            margin: 0;
        }

        .font-size-buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .font-size-btn {
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            transition: background-color 0.2s;
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .font-size-btn:hover:not(:disabled) {
            background-color: #5568d3;
        }

        .font-size-btn:active:not(:disabled) {
            background-color: #4557c1;
        }

        .font-size-btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .font-size-value {
            min-width: 50px;
            text-align: center;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .dark-mode .controls {
            background-color: #2a2a2a;
            border-top-color: #444;
        }

        .dark-mode .controls h3 {
            color: #fff;
        }

        .dark-mode .checkbox-item label {
            color: #ddd;
        }

        .dark-mode .font-size-control {
            border-top-color: #444;
        }

        .dark-mode .font-size-control label {
            color: #fff;
        }

        .dark-mode .font-size-value {
            color: #fff;
        }

        .hamburger-btn {
            display: none;
            background-color: transparent;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            padding: 10px 15px;
            min-width: 44px;
            min-height: 44px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
            position: absolute;
            top: 40px;
            left: 20px;
            z-index: 101;
        }

        .hamburger-btn:active {
            opacity: 0.7;
        }

        .header-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .mobile-menu.open {
            display: flex !important;
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .mobile-menu-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 80vw;
            max-width: 300px;
            height: 100vh;
            background-color: white;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.2);
            overflow-y: auto;
            z-index: 100;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            padding: 20px;
            border: 3px solid red;
        }

        .mobile-menu.open .mobile-menu-content {
            transform: translateX(0);
        }

        .dark-mode .mobile-menu-content {
            background-color: #2a2a2a;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.5);
        }

        .mobile-menu-close {
            background-color: transparent;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 10px;
            float: right;
            color: #333;
            min-width: 44px;
            min-height: 44px;
        }

        .dark-mode .mobile-menu-close {
            color: #fff;
        }

        @media (max-width: 768px) {
            header {
                position: relative;
            }

            .hamburger-btn {
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .controls {
                display: none;
            }

            .mobile-menu-content {
                position: absolute;
                top: 0;
                right: 0;
                width: auto;
                max-width: 100%;
                height: auto;
                background-color: #f5f5f5;
                box-shadow: none;
                transform: scaleY(0);
                transform-origin: top right;
                border-bottom: 1px solid #e0e0e0;
                padding: 15px;
            }

            .mobile-menu.open .mobile-menu-content {
                transform: scaleY(1);
            }

            .mobile-menu {
                position: static;
                background-color: transparent;
                opacity: 1;
                pointer-events: auto;
            }

            .mobile-menu-close {
                display: none;
            }

            .dark-mode .mobile-menu-content {
                background-color: #2a2a2a;
            }

            header h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .checkbox-group {
                gap: 15px;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 20px;
            }

            .table-wrapper {
                padding: 10px;
            }

            th, td {
                padding: 6px;
            }

            table {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-content" id="mobileMenuContent">
            <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">✕</button>
            <div class="controls" id="mobileControls">
                <h3>Show/Hide Grading Systems</h3>
                <div class="checkbox-group" id="mobileControlsGroup">
                </div>

                <div class="font-size-control">
                    <label>Font Size:</label>
                    <div class="font-size-buttons">
                        <button class="font-size-btn" id="decreaseFontBtnMobile" aria-label="Decrease font size">−</button>
                        <span class="font-size-value" id="fontSizeValueMobile">14px</span>
                        <button class="font-size-btn" id="increaseFontBtnMobile" aria-label="Increase font size">+</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🧗 Climbing Grade Conversion Chart</h1>
            <p>Rockfax Single Grade Conversion 2021</p>
            <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle menu">☰</button>
        </header>

        <div class="table-wrapper">
            <table id="gradesTable">
                <thead>
                    <tr>
                        <th data-column="sport">Sport Grade</th>
                        <th data-column="britTrad">British Trad</th>
                        <th data-column="uiaa">UIAA</th>
                        <th data-column="yds">YDS (USA)</th>
                        <th data-column="norway">Norway</th>
                        <th data-column="australia">Australia</th>
                        <th data-column="category">Category</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="controls" id="desktopControls">
            <h3>Show/Hide Grading Systems</h3>
            <div class="checkbox-group" id="controlsGroup">
            </div>

            <div class="font-size-control">
                <label>Font Size:</label>
                <div class="font-size-buttons">
                    <button class="font-size-btn" id="decreaseFontBtn" aria-label="Decrease font size">−</button>
                    <span class="font-size-value" id="fontSizeValue">14px</span>
                    <button class="font-size-btn" id="increaseFontBtn" aria-label="Increase font size">+</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Climbing grades data
        const gradesData = [
            { sport: '1', britTrad: 'Mod', uiaa: 'I', yds: '5.1', norway: '-', australia: '4', category: 'Beginner' },
            { sport: '2', britTrad: '-', uiaa: 'II', yds: '5.2', norway: '3', australia: '6', category: 'Beginner' },
            { sport: '2+', britTrad: 'Diff', uiaa: 'III', yds: '5.3', norway: '4', australia: '8', category: 'Beginner' },
            { sport: '3a', britTrad: 'VDiff', uiaa: 'III+', yds: '5.4', norway: '-', australia: '10', category: 'Beginner' },
            { sport: '3b', britTrad: '-', uiaa: 'IV-', yds: '5.5', norway: '4+', australia: '-', category: 'Beginner' },
            { sport: '3c', britTrad: 'Sev/HVD', uiaa: 'IV', yds: '-', norway: '-', australia: '12', category: 'Beginner' },
            { sport: '4a', britTrad: '-', uiaa: 'IV+', yds: '5.6', norway: '5-', australia: '-', category: 'Beginner' },
            { sport: '4b', britTrad: 'HS', uiaa: 'V-', yds: '5.7', norway: '5', australia: '14', category: 'Experienced' },
            { sport: '4c', britTrad: 'VS', uiaa: 'V', yds: '5.8', norway: '-', australia: '15', category: 'Experienced' },
            { sport: '5a', britTrad: '-', uiaa: 'V+', yds: '-', norway: '5+', australia: '16', category: 'Experienced' },
            { sport: '5b', britTrad: 'HVS', uiaa: 'VI-', yds: '5.9', norway: '-', australia: '17', category: 'Experienced' },
            { sport: '5c', britTrad: 'E1', uiaa: 'VI', yds: '5.10a', norway: '6-', australia: '18', category: 'Experienced' },
            { sport: '6a', britTrad: '-', uiaa: 'VI+', yds: '5.10b', norway: '6', australia: '19', category: 'Experienced' },
            { sport: '6a+', britTrad: 'E2', uiaa: 'VII-', yds: '-', norway: '-', australia: '20', category: 'Advanced' },
            { sport: '6b', britTrad: '-', uiaa: '-', yds: '5.10c', norway: '6+', australia: '21', category: 'Advanced' },
            { sport: '6b+', britTrad: 'E3', uiaa: 'VII', yds: '5.10d', norway: '-', australia: '-', category: 'Advanced' },
            { sport: '6c', britTrad: '-', uiaa: 'VII+', yds: '5.11a', norway: '7-', australia: '22', category: 'Advanced' },
            { sport: '6c+', britTrad: 'E4', uiaa: 'VIII-', yds: '5.11b', norway: '-', australia: '23', category: 'Advanced' },
            { sport: '-', britTrad: '-', uiaa: '-', yds: '5.11c', norway: '7', australia: '24', category: 'Advanced' },
            { sport: '7a', britTrad: 'E5', uiaa: 'VIII', yds: '5.11d', norway: '7+', australia: '25', category: 'Advanced' },
            { sport: '7a+', britTrad: '-', uiaa: '-', yds: '5.12a', norway: '-', australia: '-', category: 'Advanced' },
            { sport: '7b', britTrad: 'E6', uiaa: 'VIII+', yds: '5.12b', norway: '8-', australia: '26', category: 'Expert' },
            { sport: '7b+', britTrad: '-', uiaa: 'IX-', yds: '5.12c', norway: '8', australia: '27', category: 'Expert' },
            { sport: '7c', britTrad: 'E7', uiaa: 'IX', yds: '5.12d', norway: '-', australia: '28', category: 'Expert' },
            { sport: '7c+', britTrad: '-', uiaa: 'IX+', yds: '5.13a', norway: '8+', australia: '29', category: 'Expert' },
            { sport: '8a', britTrad: 'E8', uiaa: 'X-', yds: '5.13b', norway: '9-', australia: '30', category: 'Elite' },
            { sport: '8a+', britTrad: '-', uiaa: '-', yds: '5.13c', norway: '-', australia: '31', category: 'Elite' },
            { sport: '8b', britTrad: 'E9', uiaa: 'X', yds: '5.13d', norway: '9', australia: '32', category: 'Elite' },
            { sport: '8b+', britTrad: '-', uiaa: 'X+', yds: '5.14a', norway: '9+', australia: '33', category: 'Elite' },
            { sport: '8c', britTrad: 'E10', uiaa: 'XI-', yds: '5.14b', norway: '-', australia: '34', category: 'Elite' },
            { sport: '8c+', britTrad: '-', uiaa: 'XI', yds: '5.14c', norway: '10-', australia: '-', category: 'Elite' },
            { sport: '9a', britTrad: 'E11', uiaa: 'XI+', yds: '5.14d', norway: '10', australia: '35', category: 'Elite' },
            { sport: '9a+', britTrad: '-', uiaa: '-', yds: '5.15a', norway: '-', australia: '36', category: 'Elite' },
            { sport: '9b', britTrad: '-', uiaa: 'XII-', yds: '5.15b', norway: '10+', australia: '37', category: 'Elite' },
            { sport: '9b+', britTrad: '-', uiaa: 'XII', yds: '5.15c', norway: '11-', australia: '38', category: 'Elite' }
        ];

        // Column configuration
        const columns = [
            { id: 'sport', name: 'Sport Grade', visible: true },
            { id: 'britTrad', name: 'British Trad', visible: false },
            { id: 'uiaa', name: 'UIAA', visible: false },
            { id: 'yds', name: 'YDS', visible: true },
            { id: 'norway', name: 'Norway', visible: false },
            { id: 'australia', name: 'Australia', visible: false },
            { id: 'category', name: 'Category', visible: true }
        ];

        // Initialize
         function init() {
             renderTable();
             renderControls();
             attachEventListeners();
         }

         function renderTable() {
             const tbody = document.getElementById('tableBody');
             tbody.innerHTML = '';

             gradesData.forEach(grade => {
                 const row = document.createElement('tr');
                 const categoryLower = grade.category.toLowerCase();
                 row.className = `grade-${categoryLower}`;

                 columns.forEach(col => {
                     if (col.visible) {
                         const td = document.createElement('td');
                         if (col.id === 'category') {
                             td.innerHTML = `<span class="category-badge badge-${categoryLower}">${grade.category}</span>`;
                         } else {
                             td.textContent = grade[col.id];
                         }
                         row.appendChild(td);
                     }
                 });

                 tbody.appendChild(row);
             });

             updateTableHeaders();
         }

         function updateTableHeaders() {
             const headers = document.querySelectorAll('th');
             headers.forEach(th => {
                 const colId = th.dataset.column;
                 const col = columns.find(c => c.id === colId);
                 
                 if (colId === 'sport') {
                     th.style.display = '';
                 } else if (col) {
                     th.style.display = col.visible ? '' : 'none';
                 }
             });
         }

         function renderControls() {
             // Render desktop controls
             const controlsGroup = document.getElementById('controlsGroup');
             controlsGroup.innerHTML = '';

             // Render mobile controls
             const mobileControlsGroup = document.getElementById('mobileControlsGroup');
             mobileControlsGroup.innerHTML = '';

             columns.forEach(col => {
                 if (col.id !== 'sport') { // Skip sport grade - always visible
                     // Desktop version
                     const div = document.createElement('div');
                     div.className = 'checkbox-item';
                     
                     const input = document.createElement('input');
                     input.type = 'checkbox';
                     input.id = `col-${col.id}`;
                     input.checked = col.visible;
                     input.dataset.column = col.id;

                     const label = document.createElement('label');
                     label.htmlFor = `col-${col.id}`;
                     label.textContent = col.name;

                     div.appendChild(input);
                     div.appendChild(label);
                     controlsGroup.appendChild(div);

                     // Mobile version
                     const divMobile = document.createElement('div');
                     divMobile.className = 'checkbox-item';
                     
                     const inputMobile = document.createElement('input');
                     inputMobile.type = 'checkbox';
                     inputMobile.id = `col-${col.id}-mobile`;
                     inputMobile.checked = col.visible;
                     inputMobile.dataset.column = col.id;

                     const labelMobile = document.createElement('label');
                     labelMobile.htmlFor = `col-${col.id}-mobile`;
                     labelMobile.textContent = col.name;

                     divMobile.appendChild(inputMobile);
                     divMobile.appendChild(labelMobile);
                     mobileControlsGroup.appendChild(divMobile);
                 }
             });
         }

         function attachEventListeners() {
             // Desktop checkboxes
             document.querySelectorAll('#controlsGroup input[type="checkbox"]').forEach(checkbox => {
                 checkbox.addEventListener('change', (e) => {
                     const colId = e.target.dataset.column;
                     const col = columns.find(c => c.id === colId);
                     if (col) {
                         col.visible = e.target.checked;
                         localStorage.setItem(`col-${colId}`, col.visible);
                         renderTable();
                         // Sync mobile checkbox
                         const mobileCheckbox = document.getElementById(`col-${colId}-mobile`);
                         if (mobileCheckbox) mobileCheckbox.checked = col.visible;
                     }
                 });
             });

             // Mobile checkboxes
             document.querySelectorAll('#mobileControlsGroup input[type="checkbox"]').forEach(checkbox => {
                 checkbox.addEventListener('change', (e) => {
                     const colId = e.target.dataset.column;
                     const col = columns.find(c => c.id === colId);
                     if (col) {
                         col.visible = e.target.checked;
                         localStorage.setItem(`col-${colId}`, col.visible);
                         renderTable();
                         // Sync desktop checkbox
                         const desktopCheckbox = document.getElementById(`col-${colId}`);
                         if (desktopCheckbox) desktopCheckbox.checked = col.visible;
                     }
                 });
             });

             // Desktop font size button listeners
             const decreaseBtn = document.getElementById('decreaseFontBtn');
             const increaseBtn = document.getElementById('increaseFontBtn');
             setupLongPress(decreaseBtn, () => changeFontSize(-1));
             setupLongPress(increaseBtn, () => changeFontSize(1));

             // Mobile font size button listeners
             const decreaseBtnMobile = document.getElementById('decreaseFontBtnMobile');
             const increaseBtnMobile = document.getElementById('increaseFontBtnMobile');
             setupLongPress(decreaseBtnMobile, () => changeFontSize(-1));
             setupLongPress(increaseBtnMobile, () => changeFontSize(1));
         }

         function setupHamburgerMenu() {
             const hamburgerBtn = document.getElementById('hamburgerBtn');
             const mobileMenu = document.getElementById('mobileMenu');
             const mobileMenuClose = document.getElementById('mobileMenuClose');

             if (!hamburgerBtn || !mobileMenu || !mobileMenuClose) {
                 console.error('Hamburger menu elements not found', { hamburgerBtn, mobileMenu, mobileMenuClose });
                 return;
             }

             // Open menu
             hamburgerBtn.addEventListener('click', (e) => {
                 e.preventDefault();
                 e.stopPropagation();
                 console.log('Hamburger clicked, opening menu');
                 mobileMenu.classList.add('open');
                 const content = document.getElementById('mobileMenuContent');
                 console.log('Before transform:', content.style.transform);
                 // Force reflow to trigger transition
                 content.offsetHeight;
                 content.style.transform = 'translateX(0)';
                 console.log('After transform:', content.style.transform);
             });

             // Close menu button
             mobileMenuClose.addEventListener('click', (e) => {
                 e.preventDefault();
                 e.stopPropagation();
                 console.log('Close button clicked, closing menu');
                 const content = document.getElementById('mobileMenuContent');
                 content.style.transform = 'translateX(-100%)';
                 mobileMenu.classList.remove('open');
             });

             // Close menu when clicking outside
             mobileMenu.addEventListener('click', (e) => {
                 if (e.target === mobileMenu) {
                     console.log('Clicked outside menu, closing');
                     mobileMenu.classList.remove('open');
                 }
             });

             // Close menu when clicking outside
             document.addEventListener('click', (e) => {
                 if (window.innerWidth <= 768 && 
                     !mobileMenu.contains(e.target) && 
                     !hamburgerBtn.contains(e.target) &&
                     mobileMenu.classList.contains('open')) {
                     console.log('Clicked outside, closing menu');
                     mobileMenu.classList.remove('open');
                 }
             });
         }

        function setupLongPress(button, callback) {
            let pressTimer;
            let isPressed = false;
            
            function startPress() {
                isPressed = true;
                callback();
                pressTimer = setTimeout(() => {
                    if (isPressed) {
                        // Start rapid fire
                        const rapidInterval = setInterval(() => {
                            if (!isPressed) {
                                clearInterval(rapidInterval);
                                return;
                            }
                            callback();
                        }, 100);
                    }
                }, 300);
            }

            function endPress() {
                isPressed = false;
                clearTimeout(pressTimer);
            }

            // Mouse events
            button.addEventListener('mousedown', startPress);
            button.addEventListener('mouseup', endPress);
            button.addEventListener('mouseleave', endPress);

            // Touch events
            button.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startPress();
            }, { passive: false });
            button.addEventListener('touchend', endPress);
            button.addEventListener('touchcancel', endPress);
        }

        function changeFontSize(delta) {
            const currentSize = parseInt(localStorage.getItem('fontSize')) || 14;
            const newSize = Math.max(12, Math.min(24, currentSize + delta));
            
            if (newSize !== currentSize) {
                localStorage.setItem('fontSize', newSize);
                setFontSize(newSize);
            }
        }

        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size + 'px');
            document.getElementById('fontSizeValue').textContent = size + 'px';
            document.getElementById('fontSizeValueMobile').textContent = size + 'px';
            updateButtonStates();
        }

        function updateButtonStates() {
            const fontSize = getComputedStyle(document.documentElement).getPropertyValue('--font-size').trim();
            const currentSize = parseInt(fontSize) || 14;
            
            // Desktop buttons
            const decreaseBtn = document.getElementById('decreaseFontBtn');
            const increaseBtn = document.getElementById('increaseFontBtn');
            decreaseBtn.disabled = currentSize <= 12;
            increaseBtn.disabled = currentSize >= 24;

            // Mobile buttons
            const decreaseBtnMobile = document.getElementById('decreaseFontBtnMobile');
            const increaseBtnMobile = document.getElementById('increaseFontBtnMobile');
            decreaseBtnMobile.disabled = currentSize <= 12;
            increaseBtnMobile.disabled = currentSize >= 24;
        }

        function loadPreferences() {
            columns.forEach(col => {
                const saved = localStorage.getItem(`col-${col.id}`);
                if (saved !== null) {
                    col.visible = saved === 'true';
                }
            });

            // Load font size
            const savedFontSize = parseInt(localStorage.getItem('fontSize')) || 14;
            setFontSize(savedFontSize);
        }

        // Load saved preferences and initialize
        loadPreferences();
        init();
        setupHamburgerMenu();
        </script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
