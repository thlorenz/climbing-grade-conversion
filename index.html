<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <meta name="description" content="Convert climbing grades across different grading systems">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Climbing Table">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%23667eea' width='192' height='192'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='100' font-family='sans-serif' fill='%23fff'>🧗</text></svg>">
    <title>Climbing Grade Conversion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --font-size: 14px;
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #f8f9fa;
            --bg-hover: #f9f9f9;
            --text-primary: #333333;
            --text-secondary: #555555;
            --border-color: #e0e0e0;
            --table-border: #667eea;
            --accent-color: #667eea;
        }

        body.dark-mode {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #1f1f1f;
            --bg-hover: #2a2a2a;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --border-color: #333333;
            --table-border: #8b9dff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
            transition: background-color 0.3s ease;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-primary);
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 20px;
            background-color: var(--bg-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size);
        }

        th {
            background-color: var(--bg-tertiary);
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid var(--table-border);
            color: var(--text-primary);
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-secondary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        tr:hover {
            background-color: var(--bg-hover);
        }

        .grade-beginner {
            background-color: #e8f5e9;
        }

        body.dark-mode .grade-beginner {
            background-color: #1b5e20;
        }

        .grade-experienced {
            background-color: #fff3e0;
        }

        body.dark-mode .grade-experienced {
            background-color: #663300;
        }

        .grade-advanced {
            background-color: #ffebee;
        }

        body.dark-mode .grade-advanced {
            background-color: #5a1a2a;
        }

        .grade-expert {
            background-color: #f3e5f5;
        }

        body.dark-mode .grade-expert {
            background-color: #3a1a5a;
        }

        .grade-elite {
            background-color: #eceff1;
        }

        body.dark-mode .grade-elite {
            background-color: #1a2a35;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-beginner {
            background-color: #4caf50;
            color: white;
        }

        .badge-experienced {
            background-color: #ff9800;
            color: white;
        }

        .badge-advanced {
            background-color: #f44336;
            color: white;
        }

        .badge-expert {
            background-color: #673ab7;
            color: white;
        }

        .badge-elite {
            background-color: #263238;
            color: white;
        }

        .controls {
            padding: 20px;
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .controls h3 {
            margin-bottom: 15px;
            color: var(--text-primary);
            font-size: 16px;
        }

        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-item input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-item label {
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .dark-mode-control {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background-color: #ccc;
            border-radius: 14px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            border: none;
            padding: 0;
        }

        .toggle-switch.active {
            background-color: #667eea;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: left 0.3s ease;
        }

        .toggle-switch.active::after {
            left: 24px;
        }

        .dark-mode-label {
            font-size: 14px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .font-size-control {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .font-size-control label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .font-size-input-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .font-size-input-group input[type="range"] {
            flex: 1;
            height: 40px;
            cursor: pointer;
            accent-color: #667eea;
            -webkit-appearance: slider-horizontal;
        }

        .font-size-value {
            min-width: 50px;
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            text-align: center;
            padding: 8px 12px;
            background-color: var(--bg-tertiary);
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            .checkbox-group {
                gap: 15px;
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            header {
                padding: 20px 15px;
            }

            header h1 {
                font-size: 20px;
            }

            .controls {
                padding: 15px;
            }

            .controls h3 {
                font-size: 14px;
                margin-bottom: 10px;
            }

            .controls-row {
                flex-direction: column;
                gap: 20px;
            }

            .table-wrapper {
                padding: 10px;
            }

            th, td {
                padding: 6px;
            }

            table {
                font-size: 11px;
            }

            .font-size-input-group {
                flex-direction: column;
                gap: 10px;
            }

            .font-size-input-group input[type="range"] {
                width: 100%;
            }

            .font-size-value {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧗 Climbing Grade Conversion Chart</h1>
            <p>Rockfax Single Grade Conversion 2021</p>
        </header>

        <div class="controls">
            <div class="controls-row">
                <div>
                    <h3>Show/Hide Grading Systems</h3>
                    <div class="checkbox-group" id="controlsGroup">
                    </div>
                </div>
                <div class="dark-mode-control" id="darkModeToggle">
                    <button class="toggle-switch" id="darkModeButton" aria-label="Toggle dark mode"></button>
                    <label class="dark-mode-label" for="darkModeButton">Dark Mode</label>
                </div>
            </div>
            
            <div class="font-size-control">
                <label for="fontSizeSlider">Font Size</label>
                <div class="font-size-input-group">
                    <input type="range" id="fontSizeSlider" min="12" max="24" value="14" step="1">
                    <span class="font-size-value" id="fontSizeValue">14px</span>
                </div>
            </div>
        </div>

        <div class="table-wrapper">
            <table id="gradesTable">
                <thead>
                    <tr>
                        <th data-column="sport">Sport Grade</th>
                        <th data-column="britTrad">British Trad</th>
                        <th data-column="uiaa">UIAA</th>
                        <th data-column="yds">YDS (USA)</th>
                        <th data-column="norway">Norway</th>
                        <th data-column="australia">Australia</th>
                        <th data-column="category">Category</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Climbing grades data
        const gradesData = [
            { sport: '1', britTrad: 'Mod', uiaa: 'I', yds: '5.1', norway: '-', australia: '4', category: 'Beginner' },
            { sport: '2', britTrad: '-', uiaa: 'II', yds: '5.2', norway: '3', australia: '6', category: 'Beginner' },
            { sport: '2+', britTrad: 'Diff', uiaa: 'III', yds: '5.3', norway: '4', australia: '8', category: 'Beginner' },
            { sport: '3a', britTrad: 'VDiff', uiaa: 'III+', yds: '5.4', norway: '-', australia: '10', category: 'Beginner' },
            { sport: '3b', britTrad: '-', uiaa: 'IV-', yds: '5.5', norway: '4+', australia: '-', category: 'Beginner' },
            { sport: '3c', britTrad: 'Sev/HVD', uiaa: 'IV', yds: '-', norway: '-', australia: '12', category: 'Beginner' },
            { sport: '4a', britTrad: '-', uiaa: 'IV+', yds: '5.6', norway: '5-', australia: '-', category: 'Beginner' },
            { sport: '4b', britTrad: 'HS', uiaa: 'V-', yds: '5.7', norway: '5', australia: '14', category: 'Experienced' },
            { sport: '4c', britTrad: 'VS', uiaa: 'V', yds: '5.8', norway: '-', australia: '15', category: 'Experienced' },
            { sport: '5a', britTrad: '-', uiaa: 'V+', yds: '-', norway: '5+', australia: '16', category: 'Experienced' },
            { sport: '5b', britTrad: 'HVS', uiaa: 'VI-', yds: '5.9', norway: '-', australia: '17', category: 'Experienced' },
            { sport: '5c', britTrad: 'E1', uiaa: 'VI', yds: '5.10a', norway: '6-', australia: '18', category: 'Experienced' },
            { sport: '6a', britTrad: '-', uiaa: 'VI+', yds: '5.10b', norway: '6', australia: '19', category: 'Experienced' },
            { sport: '6a+', britTrad: 'E2', uiaa: 'VII-', yds: '-', norway: '-', australia: '20', category: 'Advanced' },
            { sport: '6b', britTrad: '-', uiaa: '-', yds: '5.10c', norway: '6+', australia: '21', category: 'Advanced' },
            { sport: '6b+', britTrad: 'E3', uiaa: 'VII', yds: '5.10d', norway: '-', australia: '-', category: 'Advanced' },
            { sport: '6c', britTrad: '-', uiaa: 'VII+', yds: '5.11a', norway: '7-', australia: '22', category: 'Advanced' },
            { sport: '6c+', britTrad: 'E4', uiaa: 'VIII-', yds: '5.11b', norway: '-', australia: '23', category: 'Advanced' },
            { sport: '-', britTrad: '-', uiaa: '-', yds: '5.11c', norway: '7', australia: '24', category: 'Advanced' },
            { sport: '7a', britTrad: 'E5', uiaa: 'VIII', yds: '5.11d', norway: '7+', australia: '25', category: 'Advanced' },
            { sport: '7a+', britTrad: '-', uiaa: '-', yds: '5.12a', norway: '-', australia: '-', category: 'Advanced' },
            { sport: '7b', britTrad: 'E6', uiaa: 'VIII+', yds: '5.12b', norway: '8-', australia: '26', category: 'Expert' },
            { sport: '7b+', britTrad: '-', uiaa: 'IX-', yds: '5.12c', norway: '8', australia: '27', category: 'Expert' },
            { sport: '7c', britTrad: 'E7', uiaa: 'IX', yds: '5.12d', norway: '-', australia: '28', category: 'Expert' },
            { sport: '7c+', britTrad: '-', uiaa: 'IX+', yds: '5.13a', norway: '8+', australia: '29', category: 'Expert' },
            { sport: '8a', britTrad: 'E8', uiaa: 'X-', yds: '5.13b', norway: '9-', australia: '30', category: 'Elite' },
            { sport: '8a+', britTrad: '-', uiaa: '-', yds: '5.13c', norway: '-', australia: '31', category: 'Elite' },
            { sport: '8b', britTrad: 'E9', uiaa: 'X', yds: '5.13d', norway: '9', australia: '32', category: 'Elite' },
            { sport: '8b+', britTrad: '-', uiaa: 'X+', yds: '5.14a', norway: '9+', australia: '33', category: 'Elite' },
            { sport: '8c', britTrad: 'E10', uiaa: 'XI-', yds: '5.14b', norway: '-', australia: '34', category: 'Elite' },
            { sport: '8c+', britTrad: '-', uiaa: 'XI', yds: '5.14c', norway: '10-', australia: '-', category: 'Elite' },
            { sport: '9a', britTrad: 'E11', uiaa: 'XI+', yds: '5.14d', norway: '10', australia: '35', category: 'Elite' },
            { sport: '9a+', britTrad: '-', uiaa: '-', yds: '5.15a', norway: '-', australia: '36', category: 'Elite' },
            { sport: '9b', britTrad: '-', uiaa: 'XII-', yds: '5.15b', norway: '10+', australia: '37', category: 'Elite' },
            { sport: '9b+', britTrad: '-', uiaa: 'XII', yds: '5.15c', norway: '11-', australia: '38', category: 'Elite' }
        ];

        // Column configuration
        const columns = [
            { id: 'sport', name: 'Sport Grade', visible: true },
            { id: 'britTrad', name: 'British Trad', visible: false },
            { id: 'uiaa', name: 'UIAA', visible: false },
            { id: 'yds', name: 'YDS', visible: true },
            { id: 'norway', name: 'Norway', visible: false },
            { id: 'australia', name: 'Australia', visible: false },
            { id: 'category', name: 'Category', visible: true }
        ];

        // Initialize
        function init() {
            renderTable();
            renderControls();
            attachEventListeners();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            gradesData.forEach(grade => {
                const row = document.createElement('tr');
                const categoryLower = grade.category.toLowerCase();
                row.className = `grade-${categoryLower}`;

                columns.forEach(col => {
                    if (col.visible) {
                        const td = document.createElement('td');
                        if (col.id === 'category') {
                            td.innerHTML = `<span class="category-badge badge-${categoryLower}">${grade.category}</span>`;
                        } else {
                            td.textContent = grade[col.id];
                        }
                        row.appendChild(td);
                    }
                });

                tbody.appendChild(row);
            });

            updateTableHeaders();
        }

        function updateTableHeaders() {
            const headers = document.querySelectorAll('th');
            headers.forEach(th => {
                const colId = th.dataset.column;
                const col = columns.find(c => c.id === colId);
                
                if (colId === 'sport') {
                    th.style.display = '';
                } else if (col) {
                    th.style.display = col.visible ? '' : 'none';
                }
            });
        }

        function renderControls() {
            const controlsGroup = document.getElementById('controlsGroup');
            controlsGroup.innerHTML = '';

            columns.forEach(col => {
                if (col.id !== 'sport') { // Skip sport grade - always visible
                    const div = document.createElement('div');
                    div.className = 'checkbox-item';
                    
                    const input = document.createElement('input');
                    input.type = 'checkbox';
                    input.id = `col-${col.id}`;
                    input.checked = col.visible;
                    input.dataset.column = col.id;

                    const label = document.createElement('label');
                    label.htmlFor = `col-${col.id}`;
                    label.textContent = col.name;

                    div.appendChild(input);
                    div.appendChild(label);
                    controlsGroup.appendChild(div);
                }
            });
        }

        function attachEventListeners() {
            document.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', (e) => {
                    const colId = e.target.dataset.column;
                    const col = columns.find(c => c.id === colId);
                    if (col) {
                        col.visible = e.target.checked;
                        localStorage.setItem(`col-${colId}`, e.target.checked ? 'true' : 'false');
                        renderTable();
                    }
                });
            });
        }

        function loadSettings() {
            // Load column visibility preferences
            columns.forEach(col => {
                const saved = localStorage.getItem(`col-${col.id}`);
                if (saved !== null) {
                    col.visible = saved === 'true';
                }
            });

            // Load saved dark mode preference (must be before rendering to avoid flashing)
            const darkModePreference = localStorage.getItem('darkMode');
            if (darkModePreference === 'true') {
                document.body.classList.add('dark-mode');
            }

            // Load saved font size (must be before rendering)
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                document.documentElement.style.setProperty('--font-size', parseInt(savedFontSize, 10) + 'px');
            }
        }

        function loadPreferences() {
            // Legacy function name - redirects to loadSettings for backward compatibility
            loadSettings();
        }

        function toggleDarkMode(enable) {
            const body = document.body;
            const button = document.getElementById('darkModeButton');
            
            if (enable) {
                body.classList.add('dark-mode');
                button.classList.add('active');
            } else {
                body.classList.remove('dark-mode');
                button.classList.remove('active');
            }
            
            localStorage.setItem('darkMode', enable);
        }

        function setFontSize(size) {
            document.documentElement.style.setProperty('--font-size', size + 'px');
            document.getElementById('fontSizeSlider').value = size;
            document.getElementById('fontSizeValue').textContent = size + 'px';
            localStorage.setItem('fontSize', size);
        }

        // Load saved settings early (before rendering)
        loadSettings();
        
        // Initialize table and controls
        init();
        
        // Update UI controls to reflect loaded state
        function syncUIState() {
            // Sync checkbox states with column visibility
            columns.forEach(col => {
                const checkbox = document.getElementById(`col-${col.id}`);
                if (checkbox) {
                    checkbox.checked = col.visible;
                }
            });

            // Sync dark mode button state
            const darkModeButton = document.getElementById('darkModeButton');
            if (document.body.classList.contains('dark-mode')) {
                darkModeButton.classList.add('active');
            } else {
                darkModeButton.classList.remove('active');
            }

            // Sync font size slider and display
            const savedFontSize = localStorage.getItem('fontSize');
            if (savedFontSize) {
                const size = parseInt(savedFontSize, 10);
                document.getElementById('fontSizeSlider').value = size;
                document.getElementById('fontSizeValue').textContent = size + 'px';
            }
        }
        
        syncUIState();

        // Attach dark mode toggle listener
        document.getElementById('darkModeButton').addEventListener('click', (e) => {
            e.preventDefault();
            const isCurrentlyDark = document.body.classList.contains('dark-mode');
            toggleDarkMode(!isCurrentlyDark);
        });

        // Attach font size slider listener
        document.getElementById('fontSizeSlider').addEventListener('input', (e) => {
            setFontSize(parseInt(e.target.value, 10));
        });
    </script>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => {
                        console.log('Service Worker registered successfully:', registration);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
